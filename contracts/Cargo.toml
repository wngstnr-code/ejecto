[workspace]
resolver = "2"
members = ["coin", "factory"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/wngstnr-code/ejecto"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
uint = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
