[package]
name = "ejecto-coin"
description = "Ejecto coin: a memecoin with a built-in ejection seat (NEP-141 + bonding curve + Ejecto Fund)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Reproducible build for source verification (NearBlocks / SourceScan, NEP-330).
# Build with: cargo near build reproducible-wasm (needs Docker, a clean and pushed git tree).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
uint.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
