name: chain check

# Re-checks the live testnet deployment with no keys: every coin keyless, running the verified
# code, reserve on the curve, claims within the frozen pot. See scripts/verify-chain.mjs.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/verify-chain.mjs", ".github/workflows/chain.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-chain.mjs fleet.ejecto.testnet
